syntax = "proto3";

package pb;

import "user.proto";
option go_package = "github.com/gufir/money-management/pb";


message ForgotPasswordRequest {
    string email = 1;
}

message ForgotPasswordResponse {
    string message = 1;
}

message ResetPasswordRequest {
    string token = 1;
    string new_password = 2;
}

message ResetPasswordResponse {
    string message = 1;
}

